# Dedicated ChatGPT MCP Worker; legacy wrangler.toml is unchanged.
name = "gpt-analytics-chatgpt"
main = "src/chatgpt-worker.ts"
compatibility_date = "2026-10-30"
compatibility_flags = ["global_fetch_strictly_public"]

# Set APP_BASE_URL to the actual HTTPS origin after provisioning.
# Configure GOOGLE_ALLOWED_SUB and Google OAuth credentials as secrets/vars.
# Google OAuth redirect URI must match APP_BASE_URL + /google/callback.
# Bind a real Cloudflare KV namespace before deployment.
# [[kv_namespaces]]
# binding = "OAUTH_KV"
# id = "<Cloudflare namespace ID>"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "71035b9b751148b29d034d841e0ba97c"

[vars]
APP_BASE_URL = "https://gpt-analytics-chatgpt.dominisos1.workers.dev"
